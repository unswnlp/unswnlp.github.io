{{ define "main" }}
{{ $allNews := where site.RegularPages "Section" "news" }}
{{ $latest  := first 7 $allNews.ByDate.Reverse }}

<section class="home-news">
  <h2>Recent News</h2>
  <table class="home-news-table" style="width:100%; border-collapse: collapse;">
    {{ range $latest }}
    <tr>
      <!-- Date cell -->
      <td style="vertical-align: top; padding: 0.5em 1em 0.5em 0; white-space: nowrap; width: 8em;">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
      </td>
      <!-- Content cell -->
      <td style="vertical-align: top; padding: 0.5em 0;">
        {{ .Content }}
      </td>
    </tr>
    {{ end }}
  </table>
</section>
{{ end }}
