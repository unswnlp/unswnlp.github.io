<header class="site-header">
  <nav class="site-nav">
    <a href="{{ "/" | relURL }}" class="site-logo" aria-label="{{ site.Title }}">
      {{- site.Title -}}
    </a>
    <ul class="nav-menu">
      {{- $currentPage := . }}
      {{- range site.Menus.main }}
      {{- $menuURL := .URL | relLangURL }}
      {{- $pageURL := $currentPage.RelPermalink }}
      <li>
        <a href="{{ .URL | relLangURL }}"
           {{- if eq $menuURL $pageURL }} class="active"{{ end }}>
          {{- .Name -}}
        </a>
      </li>
      {{- end }}
    </ul>
  </nav>
</header>
