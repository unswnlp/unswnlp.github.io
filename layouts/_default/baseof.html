<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "ltr" }}">

<head>
  {{- partial "head.html" . }}
</head>

<body>
  {{- partial "header.html" . }}
  <main class="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  <script>
  document.addEventListener('click', function(e) {
    document.querySelectorAll('details.pub-cite[open]').forEach(function(d) {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
  });
  </script>
</body>

</html>
