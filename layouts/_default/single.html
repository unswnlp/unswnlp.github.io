{{- define "main" }}
<div class="content-page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Date }}
    <time class="page-date" datetime="{{ .Format "2006-01-02" }}">{{ .Format "January 2006" }}</time>
    {{- end }}
  </header>
  {{- with .Content }}
  <div class="content">{{ . }}</div>
  {{- end }}
</div>
{{- end }}
