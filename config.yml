baseURL: "https://unswnlp.github.io/"
title: UNSW-NLP

enableInlineShortcodes: true
# Publications are dated by conference date, which can be in the future
buildFuture: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Home
          url: /
          weight: 1
        - name: People
          url: people/
          weight: 2
        - name: Publications
          url: publications/
          weight: 3
        - name: Grants
          url: activities/grants/
          weight: 4
        - name: Activities
          url: activities/
          weight: 5
        - name: Location
          url: location/
          weight: 6

params:
    description: "UNSW-NLP is a research group at UNSW Sydney studying Foundational, Applied, and Inclusive Natural Language Processing."
    author: UNSW-NLP
    DateFormat: "January 2006"
    math: true
    profileMode:
          enabled: true
          title: "UNSW-NLP"
          subtitle: |
            <div class="hero-subtitle-line">UNSW-NLP is the natural language processing research group at UNSW Sydney.</div>

          join: |
            <p class="join-intro">We welcome enquiries from prospective students and researchers. <a class="join-email" href="mailto:nlproc@cse.unsw.edu.au">Email us</a> with the subject line <span class="join-subject">Expression of Interest: <em>Type</em></span>, where <em>Type</em> is one of:</p>
            <dl class="join-types">
              <div><dt>Ph.D. or M.Phil.</dt><dd>Prospective research students.</dd></div>
              <div><dt>Postdoc</dt><dd>We advertise positions when they are available.</dd></div>
              <div><dt>ToR</dt><dd>Undergraduate Taste of Research projects. <a href="people/student-work#tor">Past projects</a></dd></div>
              <div><dt>Honours</dt><dd>Honours research projects. <a href="people/student-work#honours">Past projects</a></dd></div>
              <div><dt>COMP9991</dt><dd>Master's (by coursework) research projects. <a href="https://thesis.cse.unsw.edu.au/search?search_query=&amp;search_options=true" target="_blank" rel="noopener">Example projects</a><span class="join-sep" aria-hidden="true">·</span><a href="people/student-work#comp9991">Past projects</a></dd></div>
            </dl>
            <p class="join-note">Please write your email yourself. We do not respond to AI-generated messages.</p>

          imageUrl: "prof-pic.webp"
          imageWidth: 300
          imageHeight: 300

    socialIcons:
        - name: Email
          url: "mailto:nlproc@cse.unsw.edu.au"
        - name: Google Scholar
          url: "https://scholar.google.com/citations?user=8dUrhxwAAAAJ"
        - name: Twitter
          url: "https://x.com/UNSW_NLP"
        - name: GitHub
          url: "https://github.com/unswnlp"

    assets:
        disableScrollBarStyle: true
    label:
      text: "UNSW-NLP"
      icon: logo.png
      iconHeight: 24

markup:
    goldmark:
        extensions:
            typographer:
                # Site style: no en or em dashes, so render -- and --- as plain hyphens
                enDash: "-"
                emDash: "-"
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
