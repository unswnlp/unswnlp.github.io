params:
    description: "UNSW NLP is a research group at UNSW Sydney studying Foundational, Applied, and Inclusive Natural Language Processing."
    author: UNSW NLP
    DateFormat: "January 2006"
    math: true
    profileMode:
          enabled: true
          title: "UNSW NLP Group"
          subtitle: |
            <div class="hero-subtitle-line">UNSW NLP is the natural language processing research group at UNSW Sydney. Our work spans <strong>foundational</strong> <span class="topic-tip tip-icon" tabindex="0" aria-label="Foundational topics"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="7"/><line x1="8" y1="7" x2="8" y2="11"/><circle cx="8" cy="5" r="0.5" fill="currentColor" stroke="none"/></svg><span class="topic-bubble"><ul><li>language model evaluation</li><li>efficient transformers</li><li>narrative generation</li><li>LLM personalisation</li></ul></span></span>, <strong>applied</strong> <span class="topic-tip tip-icon" tabindex="0" aria-label="Applied topics"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="7"/><line x1="8" y1="7" x2="8" y2="11"/><circle cx="8" cy="5" r="0.5" fill="currentColor" stroke="none"/></svg><span class="topic-bubble"><ul><li>clinical triage</li><li>legal text</li><li>multimodal systems</li></ul></span></span>, and <strong>inclusive</strong> <span class="topic-tip tip-icon" tabindex="0" aria-label="Inclusive topics"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="7"/><line x1="8" y1="7" x2="8" y2="11"/><circle cx="8" cy="5" r="0.5" fill="currentColor" stroke="none"/></svg><span class="topic-bubble"><ul><li>dialects and language varieties</li><li>LGBTQIA+ communities</li><li>speech for second language speakers</li></ul></span></span> NLP.</div>
            <p>Interested in joining? Email <a href="mailto:nlproc@cse.unsw.edu.au">us</a> with <strong>[Expression of Interest: <em>Type</em>]</strong> in the subject, where <em>Type</em> is one of:</p>
            <ul>
              <li><strong>Ph.D.</strong> or <strong>M.Phil.:</strong> prospective research students</li>
              <li><strong>Postdoc:</strong> we post positions when available</li>
              <li><strong>ToR:</strong> undergraduate Taste of Research (see <a href="people/student-work#tor">past work</a>)</li>
              <li><strong>Honours:</strong> Honours research project (see <a href="people/student-work#honours">past work</a>)</li>
              <li><strong>COMP9991:</strong> Masters (by coursework) research project (see <a href="people/student-work#comp9991">past work</a>)</li>
            </ul>

          imageUrl: "prof-pic.png"
          imageWidth: 300
          imageHeight: 300

    socialIcons:
        - name: Email
          url: "mailto:nlproc@cse.unsw.edu.au"
        - name: Google Scholar
          url: "https://scholar.google.com/citations?user=8dUrhxwAAAAJ"
        - name: Twitter
          url: "https://x.com/UNSW_NLP"
        - name: GitHub
          url: "https://github.com/unswnlp"

    assets:
        disableScrollBarStyle: true
    label:
      text: "UNSW NLP"
      icon: logo.png
      iconHeight: 24

markup:
    goldmark:
        extensions:
            typographer:
                # Site style: no en or em dashes, so render -- and --- as plain hyphens
                enDash: "-"
                emDash: "-"
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
